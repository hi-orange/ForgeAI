[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncmy>=0.2.11",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "langgraph>=1.2.11,<2.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
