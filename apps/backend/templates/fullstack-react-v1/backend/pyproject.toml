[project]
name = "generated-app"
version = "0.1.0"
description = "ForgeAI fullstack-react-v1 generated application"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1,<2.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
