name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: agent_platform
      SECRET_KEY: ci-test-secret-key
      FORGEAI_TEST_DOCKER: '1'
      ENGINEERING_CHECK_IMAGE: forgeai-checks:fullstack-react-v1
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: agent_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: apps/backend
        run: uv sync

      - name: Write backend env for CI
        working-directory: apps/backend
        run: |
          printf '%s\n' \
            'APP_ENV=development' \
            'MYSQL_HOST=127.0.0.1' \
            'MYSQL_PORT=3306' \
            'MYSQL_USER=root' \
            'MYSQL_PASSWORD=root' \
            'MYSQL_DATABASE=agent_platform' \
            'SECRET_KEY=ci-test-secret-key' \
            'CORS_ORIGINS=http://localhost:5173' \
            > .env.development

      - name: Run database migrations
        working-directory: apps/backend
        run: uv run alembic upgrade head

      - name: Build isolated generated-app check image
        run: docker build -f apps/backend/sandbox/Dockerfile -t forgeai-checks:fullstack-react-v1 apps/backend

      - name: Check frontend and repository formatting
        run: pnpm check

      - name: Check backend types and lint
        working-directory: apps/backend
        run: |
          uv run ruff check app tests
          uv run mypy app

      - name: Run backend tests including golden DB, API, build and browser flow
        working-directory: apps/backend
        run: uv run python -m unittest discover -s tests -v

      - name: Run frontend workflow tests
        run: pnpm --dir apps/frontend test:requirements
